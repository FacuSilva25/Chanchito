<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chanchito</title>
<meta name="description" content="Tus finanzas del mes: ingresos, gastos fijos y variables, ahorro y metas.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chanchito">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>/* Tema guardado en este dispositivo, antes de pintar para que no parpadee */
try{var t=JSON.parse(localStorage.getItem('cc-theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* Layout: iOS-style grouped surfaces; floating glass tab bar on phones, sidebar split view from 900px. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f2f2f7; --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2);
  --label:#000000; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.36); --sep:rgba(60,60,67,.18);
  --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.6); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --c-blue:#007aff; --c-green:#34c759; --c-red:#ff3b30; --c-orange:#ff9500; --c-yellow:#ffcc00; --c-purple:#af52de;
  --c-indigo:#5856d6; --c-pink:#ff2d55; --c-teal:#30b0c7; --c-mint:#00c7be; --c-brown:#a2845e; --c-gray:#8e8e93;
  --accent:var(--c-blue); --pos:#248a3d; --neg:#d70015;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --label:#ffffff; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.32); --sep:rgba(84,84,88,.55);
  --glass:rgba(30,30,32,.72); --glass-line:rgba(255,255,255,.08); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --c-blue:#0a84ff; --c-green:#30d158; --c-red:#ff453a; --c-orange:#ff9f0a; --c-yellow:#ffd60a; --c-purple:#bf5af2;
  --c-indigo:#5e5ce6; --c-pink:#ff375f; --c-teal:#40c8e0; --c-mint:#63e6e2; --c-brown:#ac8e68; --c-gray:#98989d;
  --pos:#30d158; --neg:#ff6961; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --label:#ffffff; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.32); --sep:rgba(84,84,88,.55);
  --glass:rgba(30,30,32,.72); --glass-line:rgba(255,255,255,.08); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --c-blue:#0a84ff; --c-green:#30d158; --c-red:#ff453a; --c-orange:#ff9f0a; --c-yellow:#ffd60a; --c-purple:#bf5af2;
  --c-indigo:#5e5ce6; --c-pink:#ff375f; --c-teal:#40c8e0; --c-mint:#63e6e2; --c-brown:#ac8e68; --c-gray:#98989d;
  --pos:#30d158; --neg:#ff6961; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--label);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.sidebar{display:none}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 120px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.04em}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:2px 0 0;text-wrap:balance}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
h3{font-size:17px;font-weight:600;margin:0}
.month{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.month button:hover{background:var(--fill)}
.month span{min-width:118px;text-align:center;font-weight:600;font-size:15px}
.hbtn{position:relative;height:40px;min-width:40px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--accent);font-weight:600;font-size:14px}
.hbtn:hover{background:var(--fill)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--c-red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.due{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c-orange) 18%,transparent);color:color-mix(in srgb,var(--c-orange) 75%,var(--label))}
.due.late{background:color-mix(in srgb,var(--c-red) 16%,transparent);color:var(--neg)}
.due.today{background:var(--c-red);color:#fff}
.alert-card{border:1.5px solid color-mix(in srgb,var(--c-orange) 45%,transparent)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:500;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--label);color:var(--bg)}
.pill .dot{width:8px;height:8px;border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:16px}
.btn.secondary{background:var(--fill);color:var(--accent)}
.btn.danger{background:var(--fill);color:var(--c-red)}
.btn.sm{height:34px;padding:0 14px;font-size:14px}
.btn:active{transform:scale(.97)}
.link{color:var(--accent);font-size:16px}
.link.strong{font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--c-orange) 14%,var(--surface));border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--label)}
.banner svg{color:var(--c-orange);margin-top:1px}

/* Tab bar (phones) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar-in{pointer-events:auto;display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--glass-line);box-shadow:0 10px 30px rgba(0,0,0,.14);max-width:100%}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 8px;border-radius:999px;color:var(--label-2);font-size:10.5px;font-weight:600}
.tab[aria-current="page"]{color:var(--accent);background:var(--fill)}
.tab svg.i{width:22px;height:22px}
.fab{position:fixed;z-index:21;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab svg.i{width:26px;height:26px;stroke-width:2.4}
.only-wide{display:none}

@media (min-width:900px){
  .app{grid-template-columns:248px 1fr}
  .sidebar{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:28px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--sep);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;padding:0 10px 18px}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(160deg,var(--c-green),var(--c-teal));display:grid;place-items:center;color:#fff}
  .side-link{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-weight:500;color:var(--label)}
  .side-link svg.i{color:var(--accent)}
  .side-link:hover{background:var(--fill)}
  .side-link[aria-current="page"]{background:var(--accent);color:#fff}
  .side-link[aria-current="page"] svg.i{color:#fff}
  .side-foot{margin-top:auto;font-size:12px;color:var(--label-2);padding:0 12px}
  .tabbar,.fab{display:none}
  .only-wide{display:inline-flex}
  main{padding-block:12px 56px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
}

/* Cards & grids */
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head .link{font-size:15px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid-2{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
#view{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (min-width:1000px){.grid-2{grid-template-columns:1.25fr 1fr}}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left}
.tile .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tile .ic svg.i{width:17px;height:17px;stroke-width:2.2}
.tile-l{font-size:13px;color:var(--label-2);font-weight:500}
.tile-v{font-family:var(--font-round);font-size:21px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--label-2)}
.small{font-size:13px}

/* Hero */
.hero{background:var(--surface);border-radius:28px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.hero-v{font-family:var(--font-round);font-size:clamp(38px,9vw,54px);font-weight:700;letter-spacing:-.035em;line-height:1}
.hero-sub{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:14px;color:var(--label-2)}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--fill);gap:2px}
.bar > span{display:block;height:100%;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--label-2)}
.legend b{color:var(--label);font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:56px;text-align:left;width:100%}
.li + .li{border-top:1px solid var(--sep)}
.li-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.li-ic svg.i{width:18px;height:18px;stroke-width:2.1}
.li-main{flex:1;min-width:0;display:flex;flex-direction:column}
.li-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:13px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.li-amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.li-amt.in{color:var(--pos)}
.av{width:16px;height:16px;border-radius:50%;flex:none;object-fit:cover}
.avs{display:flex}
.avs img{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;object-fit:cover}
.avs img:first-child{margin-left:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--label-3);display:grid;place-items:center;flex:none;color:transparent}
.check[aria-pressed="true"]{background:var(--c-green);border-color:var(--c-green);color:#fff}
.check svg.i{width:15px;height:15px;stroke-width:3}
.day-h{font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.03em;padding:14px 4px 6px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--fill);color:var(--label-2)}
.tag.rec{background:color-mix(in srgb,var(--c-indigo) 16%,transparent);color:var(--c-indigo)}
.tag.shared{background:color-mix(in srgb,var(--c-teal) 18%,transparent);color:color-mix(in srgb,var(--c-teal) 70%,var(--label))}
.catbar{height:6px;border-radius:999px;background:var(--fill);overflow:hidden;margin-top:6px}
.catbar span{display:block;height:100%;border-radius:999px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{height:32px;border-radius:8px;font-size:13.5px;font-weight:500;white-space:nowrap;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;background:var(--fill);color:var(--label-2)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--label);font-size:16px}

/* Goals */
.goals{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.goal{display:flex;flex-direction:column;gap:14px}
.goal-top{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-round);font-size:16px}
.goal-actions{display:flex;gap:8px;flex-wrap:wrap}
.new-card{display:grid;place-items:center;gap:8px;min-height:180px;border:2px dashed var(--sep);border-radius:var(--r-lg);color:var(--accent);font-weight:600;background:transparent;box-shadow:none}
.new-card svg.i{width:28px;height:28px}

/* Tables */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--label-2);text-align:right;padding:8px 10px;border-bottom:1px solid var(--sep);white-space:nowrap}
td{text-align:right;padding:10px;border-bottom:1px solid var(--sep);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
tr.cur td{font-weight:600}
.up{color:var(--neg)} .down{color:var(--pos)}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:220px}
.donut-wrap{display:grid;gap:16px;grid-template-columns:1fr;align-items:center}
@media (min-width:560px){.donut-wrap{grid-template-columns:200px 1fr}}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 20px}
.empty .big{width:72px;height:72px;border-radius:22px;background:linear-gradient(160deg,var(--c-green),var(--c-teal));display:grid;place-items:center;color:#fff}
.empty .big svg.i{width:36px;height:36px}
.empty p{max-width:42ch;margin:0;color:var(--label-2)}
.empty .row-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.skel{height:120px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--fill),var(--fill-2),var(--fill));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* Sheet */
#sheet-root{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet-root.open .scrim{opacity:1}
#sheet-root.open .sheet{transform:none}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(540px,92vw);max-height:86vh;border-radius:24px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .25s,opacity .2s}
  #sheet-root.open .sheet{transform:translate(-50%,-50%);opacity:1}
  .grabber{display:none}
}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill-2);margin:8px auto 0;flex:none}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px;flex:none}
.sheet-head h2{font-size:17px;font-weight:600;text-align:center}
.sheet-head .link:first-child{justify-self:start}
.sheet-head .link:last-child{justify-self:end}
.sheet-body{overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:16px}
.sheet-foot{padding:0 16px 18px;display:flex;flex-direction:column;gap:8px}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 2px}
.amount .cur{font-family:var(--font-round);font-size:30px;font-weight:600;color:var(--label-2)}
.amount input{font-family:var(--font-round);font-size:48px;font-weight:700;letter-spacing:-.03em;border:0;background:none;outline:none;width:100%;max-width:9ch;text-align:left;color:var(--label)}
.amount input::placeholder{color:var(--label-3)}
.fx-bar{display:flex;flex-direction:column;align-items:center;gap:6px;margin:-2px 0 4px;text-align:center}
.fx-bar select{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:999px;padding:5px 12px;background:var(--fill);color:var(--label);max-width:100%}
.group{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:0 14px}
.row + .row{border-top:1px solid var(--sep)}
.row > span{flex:none}
.row input:not([type=checkbox]),.row select{flex:1;min-width:0;text-align:right;border:0;background:none;outline:none;color:var(--label-2);font-size:16px;padding:10px 0}
.row select{text-align-last:right;appearance:none;-webkit-appearance:none;cursor:pointer}
.g-label{font-size:13px;color:var(--label-2);text-transform:uppercase;letter-spacing:.03em;padding:0 14px 6px}
.hint{font-size:13px;color:var(--label-2);padding:6px 14px 0}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill-2);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--c-green)}
.switch:checked::after{transform:translateX(20px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:500;border:1.5px solid transparent}
.chip .ci{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff}
.chip .ci svg.i{width:14px;height:14px;stroke-width:2.3}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.chip.plain{padding:0 14px}
.chip.tool{padding:0;width:34px;justify-content:center;color:var(--accent);background:var(--surface)}
.chip.tool svg.i{width:18px;height:18px;stroke-width:2.2}
.cat-ed .li{min-height:50px;padding:6px 0;gap:10px}
.icon-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--fill);flex:none}
.icon-btn svg.i{width:16px;height:16px;stroke-width:2.2}
.icon-btn:disabled{opacity:.3;cursor:default}
.del-btn{height:24px;min-width:24px;border-radius:999px;display:grid;place-items:center;background:var(--c-red);color:#fff;flex:none;font-size:13px;font-weight:600;padding:0}
.del-btn svg.i{width:14px;height:14px;stroke-width:3}
.del-btn.armed{padding:0 10px}
.newcat{background:var(--surface);border-radius:var(--r-md);padding:4px 0 14px;display:flex;flex-direction:column;gap:12px}
.newcat .row{border-bottom:1px solid var(--sep)}
.newcat .chips,.newcat .swatches{padding:0 14px}
.newcat .acts{display:flex;justify-content:flex-end;gap:8px;padding:0 14px}
.tag.pend{background:color-mix(in srgb,var(--c-orange) 18%,transparent);color:color-mix(in srgb,var(--c-orange) 75%,var(--label))}
.tag.ok{background:color-mix(in srgb,var(--c-green) 18%,transparent);color:var(--pos)}
.li-amt.pend{color:var(--label-2)}
.row[hidden],[hidden]{display:none!important}
.month button:disabled{opacity:.3;cursor:default;background:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.sw[aria-pressed="true"]{border-color:var(--label)}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:30px;font-weight:700;letter-spacing:.18em;text-align:center;padding:18px;background:var(--surface);border-radius:var(--r-md);user-select:all}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--label-2);font-size:14px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:60;background:var(--label);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.2,.9,.25,1);max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* PWA: configuración, login y actualizaciones */
html,body{margin:0;min-height:100%}
.toast:not(.show){visibility:hidden}
.only-narrow{display:inline-flex}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-bottom .side-foot{margin-top:0}
.side-link .dot-new{width:8px;height:8px;border-radius:50%;background:var(--c-red);margin-left:auto}
.brand-mark.pig{background:#ff5e8c;overflow:hidden}

.cfg{display:flex;flex-direction:column;gap:24px;max-width:640px}
.cfg .row .val{color:var(--label-2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.cfg .row.tap{width:100%;text-align:left}

.cfg .danger-row{color:var(--c-red);justify-content:center;font-weight:500;width:100%}
.me{display:flex;align-items:center;gap:14px;padding:14px}
.me + .row{border-top:1px solid var(--sep)}
.me .t{font-weight:600;font-size:17px}
body.auth-mode .sidebar,body.auth-mode .tabbar,body.auth-mode .fab{display:none!important}
body.auth-mode .app{grid-template-columns:1fr}
.auth{max-width:400px;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px}
.auth .logo{width:84px;height:84px;border-radius:22px;margin:0 auto;display:block;box-shadow:var(--shadow)}
.auth h1{text-align:center}
.auth p.sub{margin:-8px 0 0;text-align:center;color:var(--label-2)}
.auth form{display:flex;flex-direction:column;gap:14px}
.auth .row input{text-align:left!important;color:var(--label)!important}
.auth .row > span{width:92px}
.auth .err{color:var(--neg);font-size:14px;text-align:center;margin:0}
.auth .ok{color:var(--pos);font-size:14px;text-align:center;margin:0}
.auth .links{display:flex;flex-direction:column;align-items:center;gap:10px}
.link-plain{color:var(--accent);font-weight:500;font-size:15px}

async function usdRate(c,d){d=fxDay(d);if(c==='USD')return 1;const hit=usdCached(c,d);if(hit!=null)return hit;
  const k=usdKey(c,d);if(FX.pend[k])return FX.pend[k];

    else{const lc=c.toLowerCase();const tag=today?'latest':d;
      const get=t=>fxJSON(['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@'+t+'/v1/currencies/usd.min.json','https://'+t+'.currency-api.pages.dev/v1/currencies/usd.min.json']);

// cuántas unidades de "to" vale 1 unidad de "from" el día d
async function fxRate(from,to,d){if(from===to)return 1;const[a,b]=await Promise.all([usdRate(from,d),usdRate(to,d)]);return b/a}
function fxGet(from,to,d){if(from===to)return 1;const a=usdCached(from,d),b=usdCached(to,d);return a&&b?b/a:null}
function fxWant(from,to,d){const k=from+'>'+to+'@'+fxDay(d);if(FX.fail[k]||FX.pend['w'+k])return;
  FX.pend['w'+k]=fxRate(from,to,d).then(()=>schedule()).catch(()=>{FX.fail[k]=1}).finally(()=>{delete FX.pend['w'+k]})}

// monto de un movimiento en la moneda de la app (los mensuales en otra moneda usan la cotización de cada mes)
function amtIn(m,M){const base=cur(),stored=(m.cur||base)===base,o=origOf(m,base);

  const r2=m.cur?fxGet(m.cur,base,d):null;if(r2!=null)return round2((+m.amount||0)*r2);

/* ---------- Tarjetas y cuotas ----------
   Las tarjetas viven en settings.cards: {id,name,net,type,num(últimos 4),dueDay,closeDay,color,acc,dues:{mes:fecha}}.
   Una compra en cuotas es un movimiento kind:'cuota': mensual desde la primera cuota (month..end), n cuotas,
   amount = valor de cada cuota (con el interés incluido) e int = % de interés total. No se descuenta del disponible.
   Lo que se descuenta es el pago: un gasto variable con cat:'tarjeta', card y cardM (el mes del resumen que paga).
   Lo que no se paga de un resumen pasa al siguiente como saldo anterior. */
const CUOTAS=[1,3,6,12,18,24];
const NETS={visa:'Visa',mastercard:'Mastercard',otra:'Otra'};
const CTYPES={credito:'Crédito',debito:'Débito',prepaga:'Prepaga'};
const cards=()=>(S.settings.cards||[]).slice().sort((a,b)=>(a.created||0)-(b.created||0));

const cardSub=c=>[c.net&&c.net!=='otra'?NETS[c.net]:'',CTYPES[c.type]||'',c.num?'•••• '+c.num:''].filter(Boolean).join(' · ');

// i0: en qué cuota iba la compra cuando se cargó (por defecto 1); month es el mes de esa cuota
function cuotaIdx(m,M){if(!m.rec)return m.idx||1;const[y1,m1]=m.month.split('-').map(Number),[y2,m2]=M.split('-').map(Number);return (y2-y1)*12+(m2-m1)+(m.i0||1)}
function cardMovs(){const out=[];for(const a of accs())for(const m of Object.values(a.movs))if(m.card&&(m.kind==='cuota'||m.cardM))out.push({...m,acc:a});return out}
function cardDue(c,M){if(c.dues&&c.dues[M])return c.dues[M];if(c.dueDate&&c.dueDate.slice(0,7)===M)return c.dueDate;return c.dueDay?M+'-'+pad(Math.min(+c.dueDay,daysIn(M))):null}
// mes de la primera cuota: si la tarjeta tiene día de cierre y compraste después del cierre, va al resumen siguiente
function firstCuotaM(c,date){let M=date.slice(0,7);if(c&&c.closeDay){if(+date.slice(8,10)>+c.closeDay)M=addM(M,1);
  if(c.dueDate&&c.closeDate){const[y1,m1]=c.closeDate.split('-').map(Number),[y2,m2]=c.dueDate.split('-').map(Number);const gap=(y2-y1)*12+(m2-m1);M=addM(M,gap>=0&&gap<=2?gap:(+c.dueDay<=+c.closeDay?1:0))}
  else if(c.dueDay&&+c.dueDay<=+c.closeDay)M=addM(M,1)}return M}
function cardStmt(cid,M,all=cardMovs()){
  const mine=all.filter(m=>m.card===cid);let first=null;
  for(const m of mine){const f=m.kind==='cuota'?m.month:m.cardM;if(f&&(!first||f<first))first=f}
  let carry=0;
  if(first)for(let X=first,k=0;X<M&&k<600;X=addM(X,1),k++)for(const m of mine){if(m.kind==='cuota'){if(occurs(m,X))carry+=amtIn(m,X)}else if(m.cardM===X)carry-=amtIn(m)}
  const cuotas=[],pays=[];
  for(const m of mine){if(m.kind==='cuota'){if(occurs(m,M))cuotas.push({...m,amount:amtIn(m,M),M,i:cuotaIdx(m,M),day:dayFor(m,M)})}else if(m.cardM===M)pays.push({...m,amount:amtIn(m)})}
  cuotas.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0));pays.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const cuo=round2(cuotas.reduce((t,o)=>t+o.amount,0)),paid=round2(pays.reduce((t,o)=>t+o.amount,0));carry=round2(carry);
  const total=round2(cuo+carry);return {cuotas,pays,cuo,carry,total,paid,rest:round2(total-paid)}}
function cardIds(all=cardMovs()){const ids=cards().map(c=>c.id);for(const m of all)if(!ids.includes(m.card))ids.push(m.card);return ids}
function cardsDue(M,all=cardMovs()){let rest=0,total=0,paid=0;for(const id of cardIds(all)){const s=cardStmt(id,M,all);rest+=Math.max(s.rest,0);total+=Math.max(s.total,0);paid+=s.paid}return {rest:round2(rest),total:round2(total),paid:round2(paid)}}

function clean(o){const r={};for(const[k,v]of Object.entries(o))if(!['id','acc','day','saved'].includes(k)&&v!==undefined)r[k]=v;return r}
function cleanAcc(a){return {name:a.name,color:a.color||'blue',created:a.created||Date.now(),owner:a.owner||ME.uid||null,members:a.members||(ME.uid?[ME.uid]:[]),code:a.code||null,shared:a.scope==='s'}}
function accRef(a){return a.scope==='s'?db.collection('compartidas').doc(a.id):rootRef.collection('cuentas').doc(a.id)}
function saveLocal(){const out={settings:S.settings,accounts:{}};for(const a of accs())out.accounts[a.id]={...cleanAcc(a),scope:a.scope,movs:a.movs,metas:a.metas};store(LOCAL_KEY,out);schedule()}
async function write(fn,okMsg){if(ME.readOnly){toast('Tenés acceso de solo lectura');return false}

const loaded={p:false,s:false,set:false};
const BK=window.APP_BACKEND||null;
const noAuth=()=>store('cc-noauth')===true;
async function boot(){
  render();
  if(BK&&BK.configured&&!noAuth()){
    ME.backend='app';
    try{await BK.auth.init()}catch(e){console.error(e)}
    BK.auth.onChange(ev=>{if(ev==='PASSWORD_RECOVERY'){openNewPasswordSheet(true);return}if(ev==='USER_UPDATED'){schedule();return}location.reload()});
    if(!BK.auth.session){ME.mode='auth';return render()}
    BK.auth.ensureProfile();
    [db,user]=await Promise.all([BK.use('db'),BK.use('user')]);
  }else if(window.claude&&window.claude.use){
    ME.backend='claude';
    try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){db=null}
    claude.use('sample').then(x=>{SAMPLE=x||null;if(SAMPLE)schedule()}).catch(()=>{});
  }else return startLocal();
  if(!db||!user)return startLocal();
  ME.uid=await user.id();
  if(!ME.uid)return startLocal();
  try{const w=await user.can('data.write');if(w===false)ME.readOnly=true}catch(e){}
  ME.mode='db';
  rootRef=db.doc(`data/users/${ME.uid}/root`);
  setRef=db.doc(`data/users/${ME.uid}/settings`);
  const onErr=e=>{console.error(e);if(e&&e.code==='revoked'){ME.readOnly=true;toast('Se quitó el acceso a los datos')}};
  setRef.onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};loaded.set=true;NFreset();schedule()},onErr);
  rootRef.collection('cuentas').onSnapshot(q=>syncAccounts('p',q),onErr);
  db.collection('compartidas').where('members','array-contains',ME.uid).onSnapshot(q=>syncAccounts('s',q),onErr);
}
function NFreset(){for(const k in NF)delete NF[k]}
function syncAccounts(scope,q){
  const seen=new Set();
  for(const d of q.docs){seen.add(d.id);const data=d.data();const ex=S.accounts[d.id];
    if(ex){Object.assign(ex,data);continue}
    const a={...data,id:d.id,scope,movs:{},metas:{},_unsub:[]};S.accounts[d.id]=a;
    a._unsub.push(accRef(a).collection('movs').limit(1000).onSnapshot(qs=>{a.movs={};qs.docs.forEach(x=>a.movs[x.id]={...x.data(),id:x.id});schedule()},e=>console.error(e)));
    a._unsub.push(accRef(a).collection('metas').onSnapshot(qs=>{a.metas={};qs.docs.forEach(x=>a.metas[x.id]={...x.data(),id:x.id});schedule()},e=>console.error(e)));
  }
  for(const a of Object.values(S.accounts))if(a.scope===scope&&!seen.has(a.id)){a._unsub?.forEach(f=>f());delete S.accounts[a.id]}
  loaded[scope]=true;schedule();
}
function startLocal(){
  ME.mode='local';
  let data=store(LOCAL_KEY);
  if(!data||!data.accounts){data={settings:{currency:'ARS'},accounts:{}};store(LOCAL_KEY,data)}
  S.settings=data.settings||{};
  for(const[id,a]of Object.entries(data.accounts))S.accounts[id]={...a,id,movs:a.movs||{},metas:a.metas||{}};
  loaded.p=loaded.s=loaded.set=true;schedule();
}

function openCardSheet(c,preset={}){

// Detalle de todas las compras en cuotas que siguen vivas desde el mes M, separadas por tarjeta
function cuotasLeft(m,M){const n=m.n||1;if(!m.rec){if(m.month<M)return null;return {i:m.idx||1,n,left:1,per:amtIn(m,m.month),start:m.month,last:m.month,now:m.month===M}}
  if(m.end&&m.end<M)return null;const now=occurs(m,M);const ref=m.month>M?m.month:M;const i=cuotaIdx(m,ref);const per=amtIn(m,ref);
  return {i,n,left:n-i+1,per,start:m.month,last:m.end||addM(m.month,n-(m.i0||1)),now}}

      ${rows.length?`<div class="group" style="padding:0 14px"><div class="list">${rows.map(({m,q})=>{const ci=catInfo(m.cat,m.catName);return `<button class="li" data-act="cuotaInfo" data-acc="${m.acc.id}" data-id="${m.id}" data-m="${q.now?M:q.start}">

const NEEDS=['vivienda','servicios','super','transporte','salud','educacion'];
function hormiga(M,list){
  const t=totals(list);const thr=S.settings.hormigaMax||(t.ingreso?Math.max(Math.round(t.ingreso*0.015/500)*500,1000):15000);
  const small=list.filter(o=>o.kind==='variable'&&o.cat!=='tarjeta'&&(+o.amount||0)<=thr);
  const byDesc={};small.forEach(o=>{const k=(o.desc||'').trim().toLowerCase();(byDesc[k]=byDesc[k]||[]).push(o)});
  const groups=[];const rest=[];
  for(const arr of Object.values(byDesc))(arr.length>=2?groups.push({name:arr[0].desc,cat:arr[0].cat,catName:arr[0].catName,items:arr}):rest.push(arr[0]));
  const byCat={};rest.forEach(o=>{(byCat[o.cat]=byCat[o.cat]||[]).push(o)});
  for(const arr of Object.values(byCat))if(arr.length>=3)groups.push({name:catInfo(arr[0].cat,arr[0].catName).name+' (varios)',cat:arr[0].cat,catName:arr[0].catName,items:arr});
  groups.forEach(g=>{g.n=g.items.length;g.v=g.items.reduce((s,o)=>s+(+o.amount||0),0)});groups.sort((a,b)=>b.v-a.v);
  const total=groups.reduce((s,g)=>s+g.v,0);
  const elapsed=M===NOW_M?TODAY.getDate():daysIn(M);const factor=M===NOW_M?daysIn(M)/Math.max(elapsed,1):1;
  return {thr,groups,total,n:groups.reduce((s,g)=>s+g.n,0),monthly:total*factor,yearly:total*factor*12,variable:t.variable};
}
function catAvg(id,M,n=3){let s=0,k=0;for(let i=1;i<=n;i++){const l=occ(addM(M,-i));if(!l.length)continue;k++;s+=catTotals(l).find(c=>c.id===id)?.v||0}return k?s/k:null}
function buildReport(M){
  const list=occ(M),t=totals(list),prevT=totals(occ(addM(M,-1)));
  const cats=catTotals(list).map(c=>({...c,avg:catAvg(c.id,M)}));
  const needs=cats.filter(c=>NEEDS.includes(c.id)).reduce((s,c)=>s+c.v,0);const wants=t.gastos-needs;
  const h=hormiga(M,list);const goals=allGoals();
  const inProg=M===NOW_M;const left=daysIn(M)-TODAY.getDate();
  const R=[];const add=(lvl,title,text)=>R.push({lvl,title,text});
  if(!t.ingreso)add('warn','Cargá tus ingresos','Sin el sueldo del mes no se puede calcular cuánto te queda ni tu tasa de ahorro.');
  if(t.ingreso&&t.disp<0)add('bad','Gastaste más de lo que entró',`Te pasaste ${money(-t.disp)}. Revisá los gastos variables más grandes y frená las compras no esenciales hasta fin de mes.`);
  if(t.ingreso&&t.tasa<0.1)add('warn','Ahorrá apenas cobrás',`Estás ahorrando el ${pct(t.tasa)} de tu ingreso. Programá un ahorro mensual de ${money(Math.round(t.ingreso*0.1/1000)*1000)} (10%) el mismo día del sueldo, así no depende de lo que sobre.`);
  else if(t.ingreso&&t.tasa>=0.2)add('good','Muy buena tasa de ahorro',`Guardaste el ${pct(t.tasa)} de lo que ganaste, por encima del 20% recomendado.`);
  if(t.ingreso&&t.fijo/t.ingreso>0.5)add('warn','Tus gastos fijos pesan mucho',`Se llevan el ${pct(t.fijo/t.ingreso)} del ingreso. Revisá si podés renegociar servicios, planes de celular o seguros: cada punto que bajes se repite todos los meses.`);
  if(t.ingreso&&wants/t.ingreso>0.3)add('warn','Los gustos superan el 30%',`Gastos no esenciales: ${money(wants)} (${pct(wants/t.ingreso)} del ingreso). La regla 50/30/20 sugiere hasta 30%. Bajar a ese nivel libera ${money(wants-t.ingreso*0.3)} por mes.`);
  if(h.total>0&&(t.ingreso?h.monthly/t.ingreso>0.04:h.n>=6))add('warn','Ojo con los gastos hormiga',`${h.n} gastos chicos suman ${money(h.total)}${inProg?' en lo que va del mes':''}. A este ritmo son ${money(h.yearly)} por año. ${h.groups[0]?`El que más pesa es "${h.groups[0].name}" (${h.groups[0].n} veces).`:''}`);
  const out=['delivery','comida'].reduce((s,id)=>s+(cats.find(c=>c.id===id)?.v||0),0);const sup=cats.find(c=>c.id==='super')?.v||0;
  if(out>0&&out>sup*0.6)add('tip','Cocinar más en casa',`Entre delivery y comida afuera gastaste ${money(out)}${sup?`, contra ${money(sup)} de supermercado`:''}. Reemplazar dos pedidos por semana por comida casera puede ahorrarte cerca de ${money(out*0.3)} por mes.`);
  const subs=list.filter(o=>o.cat==='suscripciones');if(subs.length>=3)add('tip','Revisá tus suscripciones',`Tenés ${subs.length} suscripciones por ${money(subs.reduce((s,o)=>s+(+o.amount||0),0))} al mes. Cancelá las que no usaste en las últimas semanas.`);
  const onl=list.filter(o=>o.cat==='online');if(onl.length>=3)add('tip','Regla de las 24 horas',`Hiciste ${onl.length} compras online (${money(onl.reduce((s,o)=>s+(+o.amount||0),0))}). Antes de comprar algo que no planeaste, dejalo en el carrito un día: muchas compras impulsivas se caen solas.`);
  const jump=cats.filter(c=>c.avg&&c.v>c.avg*1.3&&c.v-c.avg>t.gastos*0.03).sort((a,b)=>(b.v-b.avg)-(a.v-a.avg))[0];
  if(jump)add('warn',`Subió ${jump.name}`,`Gastaste ${money(jump.v)}, ${pct((jump.v-jump.avg)/jump.avg)} más que tu promedio de los últimos meses (${money(jump.avg)}).`);
  for(const g of goals){if(!g.deadline||g.saved>=g.target)continue;const[y1,m1]=NOW_M.split('-').map(Number),[y2,m2]=g.deadline.split('-').map(Number);const mo=(y2-y1)*12+(m2-m1)+1;if(mo<=0)continue;
    const need=(g.target-g.saved)/mo;const got=list.filter(o=>o.kind==='ahorro'&&o.goal===g.id).reduce((s,o)=>s+(+o.amount||0),0);
    if(got<need*0.8){add('tip',`Meta: ${g.name}`,`Para llegar a tiempo necesitás ${money(need)} por mes y este mes aportaste ${money(got)}. Podés programar un aporte mensual automático desde la meta.`);break}}
  if(prevT.gastos&&t.gastos<prevT.gastos*0.9&&!inProg)add('good','Gastaste menos que el mes pasado',`Bajaste ${pct((prevT.gastos-t.gastos)/prevT.gastos)} respecto de ${mLabel(addM(M,-1),'month').toLowerCase()}. Si mantenés la diferencia, son ${money((prevT.gastos-t.gastos)*12)} al año.`);
  const order={bad:0,warn:1,tip:2,good:3};R.sort((a,b)=>order[a.lvl]-order[b.lvl]);
  return {M,list,t,prevT,cats,needs,wants,h,goals,inProg,left,recs:R};
}

function dateField(id,val,{empty='Elegir',clear=false}={}){return `<button type="button" class="date-btn" data-date-for="${id}" ${clear?'data-clear="1"':''} data-empty="${esc(empty)}" aria-expanded="false"><span>${val?fmtDMY(val):esc(empty)}</span>${icon('calendar')}</button><input type="hidden" id="${id}" value="${val||''}">`}
function setDate(id,v,silent){const i=document.getElementById(id);if(!i)return;i.value=v||'';const b=document.querySelector(`[data-date-for="${id}"]`);if(b)b.querySelector('span').textContent=v?fmtDMY(v):b.dataset.empty;if(!silent)i.dispatchEvent(new Event('change',{bubbles:true}))}
function toggleCal(b){const row=b.closest('.row')||b;const wasOpen=row.nextElementSibling?.classList.contains('cal');
  document.querySelectorAll('.cal').forEach(c=>c.remove());document.querySelectorAll('.date-btn[aria-expanded="true"]').forEach(x=>x.setAttribute('aria-expanded','false'));if(wasOpen)return;
  const id=b.dataset.dateFor;let view=(document.getElementById(id).value||TODAY_S).slice(0,7);
  const cal=document.createElement('div');cal.className='cal';row.after(cal);b.setAttribute('aria-expanded','true');
  const draw=()=>{const[y,m]=view.split('-').map(Number);const first=(new Date(y,m-1,1).getDay()+6)%7;const cur0=document.getElementById(id).value;
    cal.innerHTML=`<div class="cal-h"><button type="button" data-cm="-1" aria-label="Mes anterior">${icon('left')}</button><b>${mLabel(view)}</b><button type="button" data-cm="1" aria-label="Mes siguiente">${icon('right')}</button></div>
    <div class="cal-g">${['L','M','M','J','V','S','D'].map(d=>`<span class="wd">${d}</span>`).join('')}${'<span></span>'.repeat(first)}${[...Array(daysIn(view))].map((_,i)=>{const d=view+'-'+pad(i+1);return `<button type="button" data-cd="${d}" class="${d===TODAY_S?'today':''}" aria-pressed="${d===cur0}" aria-label="${fmtDMY(d)}">${i+1}</button>`}).join('')}</div>
    <div class="cal-f"><button type="button" class="link small" data-cd="${TODAY_S}">Hoy</button>${b.dataset.clear?'<button type="button" class="link small" data-cd="">Sin definir</button>':''}</div>`};
  cal.onclick=e=>{const x=e.target.closest('button');if(!x)return;e.preventDefault();e.stopPropagation();
    if(x.dataset.cm){view=addM(view,+x.dataset.cm);draw();return}
    if(x.dataset.cd!=null){setDate(id,x.dataset.cd);cal.remove();b.setAttribute('aria-expanded','false')}};
  draw();setTimeout(()=>cal.scrollIntoView({block:'nearest',behavior:'smooth'}),30)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-date-for]');if(b){e.preventDefault();toggleCal(b)}});
const accChips=(sel,name)=>`<div class="acc-chips">${chipsHTML(accs().map(a=>({id:a.id,name:a.name,color:a.color||'blue',icon:a.scope==='s'?'people':'wallet'})),sel,name)}</div>`;
function bindSeg(el,onPick){el.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));onPick(b.dataset.k)})}

function openMovSheet(mov,preset={}){

  const base=cur();const o0=mov?origOf(mov,base):{cur:base,amount:0};

    if(!(a>0)){el.textContent=`Escribí arriba el precio total${st.intOn?' sin interés':''} y te lo divido en ${st.n} ${st.n===1?'pago':'cuotas'}.`;return}

    el.innerHTML=st.n===1?`1 pago de <b>${money(tot)}</b>`:`${st.n} cuotas de <b>${money(per)}</b> · Total <b>${money(tot)}</b>${st.intOn&&st.int?` (${money(tot-a*(r>0?r:1))} de interés)`:''}${st.i0>1?`<br>Vas por la cuota ${st.i0}: se cargan ${left===1?'la última':'las '+left+' que quedan'} (<b>${money(per*left)}</b>). Las anteriores se toman como ya pagadas.`:''}${($('#f-first')?.value||'').slice(0,7)<NOW_M&&st.n>1?'<br>Ojo: las cuotas de meses que ya pasaron quedan como deuda en la tarjeta. Si ya las pagaste, elegí en qué cuota vas.':''}`};
  const i0Opts=()=>{const v=$('#f-i0v');if(!v)return;if(st.i0>st.n)st.i0=1;$('#row-i0').hidden=st.n<2;
    v.textContent=`${st.i0} de ${st.n}`;$('#f-i0-m').disabled=st.i0<=1;$('#f-i0-p').disabled=st.i0>=st.n;
    const l=$('#f-first-l');if(l)l.textContent=st.i0>1?`Fecha de la cuota ${st.i0}`:'Primera cuota'};
  // fecha de la primera cuota (o de la cuota en la que vas): se elige con el calendario, cualquier fecha; vale el mes
  const firstOpts=()=>{if(!$('#f-first')||st.firstManual)return;const d=$('#f-date').value||defDate();const c=cardById(st.card);
    if(isCuo&&st.first){setDate('f-first',mov.firstD&&mov.firstD.slice(0,7)===st.first?mov.firstD:(c&&cardDue(c,st.first))||st.first+'-'+pad(Math.min(+d.slice(8,10)||1,daysIn(st.first))),true);return}
    const M=firstCuotaM(c,d);setDate('f-first',(c&&cardDue(c,M))||M+'-'+pad(Math.min(+d.slice(8,10)||1,daysIn(M))),true)};
  const cuoBox=()=>{const box=$('#f-cuo-box');$('#f-cuo-w').hidden=st.kind!=='variable';$('#row-rec').hidden=cuoOn();

      <div><div class="g-label">Cuotas</div><div class="seg" id="f-n">${CUOTAS.map(n=>`<button type="button" data-k="${n}" aria-pressed="${n===st.n&&!st.nOther}">${n}</button>`).join('')}<button type="button" data-k="otra" aria-pressed="${!!st.nOther}">Otra</button></div></div>

    bindChips(box,'card',v=>{st.card=v;firstOpts()});

    $('#f-nc').addEventListener('input',()=>{const v=parseInt($('#f-nc').value.replace(/\D/g,''));if(v>0&&v<=72){st.n=v;i0Opts();cuoHint()}});

  cuoBox();
  $('#f-cuo').onchange=()=>{st.cuo=$('#f-cuo').checked;cuoBox()};

  const fxHint=()=>{const c=st.cur,el=$('#f-fx');if(!el)return;if(c===base){el.textContent='';return}

        else{if(isEdit)await B.delMov(mov.acc,mov.id);await B.putMov(a,{...cb,id:newId()})}
      },isEdit?'Cambios guardados':n===1?'Compra cargada en la tarjeta':`Listo: ${n} cuotas de ${money(cb.amount)} en ${cardName(cardById(st.card))}`)}
    const body={kind:st.kind,amount:st.kind==='ahorro'?amtB*st.sign:amtB,cur:base,fx,notif,desc,cat,catName:ci.name,date,due,month:(due&&due>date?due:date).slice(0,7),rec,goal:st.kind==='ahorro'?(st.goal||null):null,end:null,skip:[],paid:[],by:mov?.by||ME.uid||null,created:mov?.created||Date.now()};
    return write(async()=>{
      if(!isEdit){await B.putMov(a,{...body,id:newId()});return}
      const old=S.accounts[mov.acc.id].movs[mov.id];
      if(isCuo){if(a.id!==mov.acc.id){await B.delMov(mov.acc,mov.id);await B.putMov(a,{...body,id:newId()})}else await B.putMov(a,{...body,id:mov.id});return}

      }else{

        if(a.id!==mov.acc.id){await B.delMov(mov.acc,mov.id);await B.putMov(a,{...body,...keep,id:newId()})}

    root.querySelector('#del-all')?.addEventListener('click',e=>confirmBtn(e.currentTarget,async()=>{if(await write(()=>B.delMov(a,mov.id),'Movimiento eliminado'))closeSheet()}));
    root.querySelector('#del-one')?.addEventListener('click',e=>confirmBtn(e.currentTarget,async()=>{if(await write(()=>B.putMov(a,{...old,skip:[...(old.skip||[]),UI.month]}),'Quitado de este mes'))closeSheet()}));

  }
}

async function relabelAll(to){for(const a of accs()){for(const m of Object.values(a.movs))if(m.cur&&m.cur!==to)await B.putMov(a,{...m,cur:to,fx:m.fx&&m.fx.cur===to?null:m.fx});
  for(const g of Object.values(a.metas))if(g.cur&&g.cur!==to)await B.putMeta(a,{...g,cur:to,fx:null})}
  await B.saveSettings({...S.settings,currency:to})}
async function convertAll(from,to,say){if(ME.readOnly){toast('Tenés acceso de solo lectura');return false}
  const jobs=[];const need=new Map();
  for(const a of accs()){
    for(const m of Object.values(a.movs)){const o=origOf(m,from);const d=fxDay(m.date);jobs.push({a,m,o,d,meta:false});if(o.cur!==to)need.set(o.cur+'|'+d,[o.cur,d])}
    for(const g of Object.values(a.metas)){const o=g.fx&&g.fx.cur?{cur:g.fx.cur,amount:+g.fx.amount||0}:{cur:g.cur||from,amount:+g.target||0};jobs.push({a,m:g,o,d:TODAY_S,meta:true});if(o.cur!==to)need.set(o.cur+'|'+TODAY_S,[o.cur,TODAY_S])}}
  const hm=S.settings.hormigaMax;if(hm)need.set(from+'|'+TODAY_S,[from,TODAY_S]);
  // 1) traer todas las cotizaciones antes de tocar nada
  const R={};const list=[...need.values()];let done=0,fail=null;
  say('Buscando cotizaciones…');
  const worker=async()=>{while(list.length&&!fail){const[c,d]=list.shift();try{R[c+'|'+d]=await fxRate(c,to,d)}catch(e){fail=c+' del '+d.split('-').reverse().join('/')}done++;say(`Buscando cotizaciones… ${done}/${need.size}`)}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(fail){say('');toast('No pude traer la cotización de '+fail+'. Revisá la conexión y probá de nuevo.');return false}
  // 2) guardar
  return write(async()=>{let i=0;const src=fxSrc(from,to);
    for(const j of jobs){i++;if(i%10===0)say(`Convirtiendo… ${i}/${jobs.length}`);
      const{a,m,o,d}=j;let amount,fx;
      if(o.cur===to){amount=o.amount;fx=null}else{const r=R[o.cur+'|'+d];amount=round2(o.amount*r);fx={cur:o.cur,amount:o.amount,rate:r,date:d,src:o.cur==='ARS'||to==='ARS'?fxSrc(o.cur,to):'Mercado'}}
      if(j.meta)await B.putMeta(a,{...m,target:amount,cur:to,fx});else await B.putMov(a,{...m,amount,cur:to,fx})}
    const ns={...S.settings,currency:to};if(hm)ns.hormigaMax=round2(hm*R[from+'|'+TODAY_S]);
    await B.saveSettings(ns)},null)}

/* Actualizaciones (service worker) */
function setWaiting(w){UPD.waiting=w;try{w.postMessage('GET_VERSION')}catch(e){}schedule()}
function initSW(){
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol)||window.claude)return;
  navigator.serviceWorker.addEventListener('message',e=>{const d=e.data||{};if(d.type!=='VERSION')return;
    if(UPD.waiting&&e.source===UPD.waiting){UPD.newVersion=d.version;UPD.notes=d.notes||''}else UPD.version=d.version;schedule()});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(UPD.applying)location.reload()});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    UPD.reg=reg;
    if(reg.waiting&&navigator.serviceWorker.controller)setWaiting(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)setWaiting(w)})});
    navigator.serviceWorker.ready.then(r=>{(navigator.serviceWorker.controller||r.active)?.postMessage('GET_VERSION')});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(e=>console.warn('SW',e));
}
function applyUpdate(){
  if(!UPD.waiting)return checkUpdate();
  UPD.applying=true;toast('Actualizando…');UPD.waiting.postMessage('SKIP_WAITING');
  setTimeout(()=>location.reload(),4000);
}
async function checkUpdate(){
  if(!UPD.reg){toast(location.protocol.startsWith('http')?'Este navegador no permite actualizar la app desde acá. Recargá la página.':'Las actualizaciones funcionan cuando la app está publicada en internet.');return}
  if(UPD.checking)return;UPD.checking=true;schedule();
  try{await UPD.reg.update();
    for(let i=0;i<40&&!UPD.waiting&&UPD.reg.installing;i++)await new Promise(r=>setTimeout(r,150));
    if(UPD.reg.waiting&&!UPD.waiting)setWaiting(UPD.reg.waiting);
  }catch(e){console.warn(e)}
  UPD.checking=false;
  if(UPD.waiting)applyUpdate();else{toast('Ya tenés la última versión');schedule()}
}

/* Importar planilla: Excel (.xlsx) o CSV.

async function unzipFile(buf){

    const start=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true);const data=u8.subarray(start,start+f.size);

}

function parseCSV(text){

        const per=h.cuotaAmt!=null?Math.abs(amt):Math.abs(amt)/(total-from+1);
        for(let i=from;i<=total;i++){const M=addM(date.slice(0,7),i-from);const d=M+'-'+pad(Math.min(+date.slice(8,10),daysIn(M)));
          add({...base,kind:'variable',amount:Math.round(per*100)/100,desc:total>1?`${desc} (cuota ${i}/${total})`:desc,cat:c.id,catName:c.name,date:d,month:M,cardPay:cp,cq:{i,n:total,desc}},['card',date,nrm(desc0),amt,i].join('|'))}
      }else add({...base,kind,amount:Math.abs(amt),desc,cat:c.id,catName:c.name,date,month:date.slice(0,7),due:kind==='fijo'?date:null,paid:kind==='fijo'?[date.slice(0,7)]:[],cardPay:cp},[kind,date,nrm(desc0),amt].join('|'));
    }
    res.push({name:sh.name,movs,skipped,card});
  }
  return{sheets:res,newCats:[...newCats.values()]};
}
function pickSheet(){const i=document.createElement('input');i.type='file';i.accept='.xlsx,.csv,.tsv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv';i.onchange=()=>{if(i.files[0])importSheetFile(i.files[0])};i.click()}
async function importSheetFile(file){
  let sheets;
  try{
    const buf=await file.arrayBuffer();const u8=new Uint8Array(buf);
    if(u8[0]===0x50&&u8[1]===0x4b)sheets=await readXlsx(buf);
    else if(/\.xls$|\.ods$|\.numbers$/i.test(file.name)||(u8[0]===0xd0&&u8[1]===0xcf)){toast('Guardá la planilla como .xlsx o .csv y probá de nuevo');return}
    else{let t=new TextDecoder().decode(u8);if(t.includes('�'))t=new TextDecoder('windows-1252').decode(u8);sheets=[{name:file.name.replace(/\.[^.]+$/,''),rows:parseCSV(t)}]}
  }catch(e){console.error(e);toast('No pude leer ese archivo. Probá guardarlo como .xlsx o .csv');return}
  openSheetImport(file.name,analyzeSheets(sheets));
}
function openSheetImport(fname,an){
  const all=an.sheets.flatMap(s=>s.movs);const hasCard=an.sheets.some(s=>s.card&&s.movs.some(m=>!m.cardPay));const nPay=all.filter(m=>m.cardPay).length;
  const st={skipPay:hasCard&&nPay>0,card:''};const nCq=all.filter(m=>m.cq).length;
  const list=accs().filter(a=>a.scope==='p'||(a.members||[]).includes(ME.uid));const accId=UI.acc!=='all'&&S.accounts[UI.acc]?UI.acc:(list[0]?.id||'');
  const help=`<div class="hint" style="padding-top:0">Reconozco planillas con una fila de títulos como <b>Fecha</b>, <b>Descripción</b> o <b>Concepto</b>, <b>Categoría</b>, <b>Subcategoría</b> y <b>Monto</b> (o Importe). Opcionales: <b>Tipo</b> (Gasto, Ingreso o Fijo) y, para tarjeta, <b>Cuotas</b> y <b>Monto cuota</b>. Una pestaña que se llame Ingresos se carga como ingresos, y una tabla con <b>Crédito</b>, <b>Valor cuota</b> y <b>Cuotas restantes</b> se carga como gasto fijo hasta la última cuota. En Configuración podés bajar una planilla modelo.</div>`;
  if(!all.length){
    const empty=an.sheets.length?`Encontré ${an.sheets.length===1?'la pestaña':'las pestañas'} ${an.sheets.map(s=>'<b>'+esc(s.name)+'</b>').join(', ')}, pero todavía no tienen filas con fecha y monto.`:'No encontré ninguna tabla con columnas de fecha y monto.';
    openSheet({title:'Importar planilla',saveLabel:'Listo',onSave:()=>true,body:`<p class="muted" style="margin:0">${esc(fname)}</p><div class="group"><div class="row" style="white-space:normal;padding-block:12px"><span style="white-space:normal">${empty}</span></div></div>${help}`});return}
  const pick=()=>all.filter(m=>!(st.skipPay&&m.cardPay));
  const months=[...new Set(all.map(m=>m.month))].sort();
  const pl=(n,a,b)=>n+' '+(n===1?a:b);
  const sheetRow=s=>{const ms=s.movs.filter(m=>!(st.skipPay&&m.cardPay));if(!ms.length)return'';
    const inc=ms.filter(m=>m.kind==='ingreso'),exp=ms.filter(m=>m.kind!=='ingreso');const tot=l=>l.reduce((t,m)=>t+m.amount,0);
    const what=s.credit?pl(ms.length,'cuota de crédito (gasto fijo hasta que termina)','cuotas de créditos (gasto fijo hasta que terminan)')
      :s.card?pl(ms.length,'cuota de tarjeta','cuotas de tarjeta (cada una en su mes)')
      :inc.length&&exp.length?pl(inc.length,'ingreso','ingresos')+' y '+pl(exp.length,'gasto','gastos'):inc.length?pl(inc.length,'ingreso','ingresos'):pl(exp.length,'gasto','gastos');
    const sk=s.skipped+(ms.length<s.movs.length?s.movs.length-ms.length:0);
    return `<div class="row" style="white-space:normal;padding-block:10px;align-items:flex-start"><span style="display:flex;flex-direction:column;flex:1;min-width:0"><span>${esc(s.name)}</span><span class="muted small">${what}${sk?' · '+pl(sk,'fila salteada','filas salteadas'):''}</span></span><span class="val num" style="text-align:right">${inc.length?'<span style="color:var(--c-green)">+'+money(tot(inc))+'</span>'+(exp.length?'<br>':''):''}${exp.length?money(tot(exp)):''}</span></div>`};
  const body=`<p class="muted" style="margin:0">${esc(fname)} · ${months.length>1?mLabel(months[0])+' a '+mLabel(months.at(-1)):mLabel(months[0])}</p>
    <div><div class="g-label">Lo que encontré</div><div class="group" id="imp-found"></div><div class="hint" id="imp-dup" hidden></div></div>
    ${nPay?`<div class="group"><label class="row" style="white-space:normal"><span style="white-space:normal;flex:1">Saltear los pagos de tarjeta (${nPay})</span><input id="imp-pay" type="checkbox" class="switch" ${st.skipPay?'checked':''}></label></div><div class="hint" style="padding-top:0">${hasCard?'Como también importo las compras con tarjeta, cargar el pago las contaría dos veces.':'Dejalo apagado si no cargás las compras con tarjeta una por una.'}</div>`:''}
    ${nCq?(cards().length?`<div><div class="group"><label class="row"><span>Compras con tarjeta</span><select id="imp-card"><option value="">Como gastos</option>${cards().map(c=>`<option value="${c.id}">${esc(cardName(c))}</option>`).join('')}</select></label></div><div class="hint" id="imp-card-h">Si elegís una tarjeta, las cuotas van a la sección Tarjetas y se descuentan cuando pagás el resumen. Las de meses anteriores se marcan como pagadas.</div></div>`
      :`<div class="hint" style="padding-top:0">Si cargás tus tarjetas en la sección Tarjetas, las compras en cuotas se pueden importar directo a una tarjeta.</div>`):''}
    <div class="hint" id="imp-cats" style="padding-top:0" hidden></div>
    <div class="group">${list.length?`<label class="row"><span>Cuenta</span><select id="imp-acc">${list.map(a=>`<option value="${a.id}" ${a.id===accId?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label>`:'<div class="row"><span>Cuenta</span><span class="val">Personal (nueva)</span></div>'}</div>
    <div class="hint" style="padding-top:0">Si importás el mismo archivo otra vez, solo se suman las filas nuevas. Las compras en cuotas aparecen en cada mes con su cuota.</div>`;
  const usedNew=ms=>{const u=new Set(ms.map(m=>m.cat));return an.newCats.filter(c=>u.has(c.id)&&!expCats().some(x=>x.id===c.id))};
  const refresh=()=>{const ms=pick();const a=S.accounts[$('#imp-acc')?.value];const old=a?ms.filter(m=>a.movs?.[m.id]).length:0;
    $('#imp-found').innerHTML=an.sheets.map(sheetRow).join('');
    const d=$('#imp-dup');d.hidden=!old;d.textContent=old===ms.length?'Todo esto ya estaba cargado en esa cuenta, así que no se va a duplicar.':`${pl(old,'movimiento ya estaba cargado','movimientos ya estaban cargados')} y no se ${old===1?'duplica':'duplican'}.`;
    const nc=usedNew(ms);const c=$('#imp-cats');c.hidden=!nc.length;c.innerHTML=`Voy a crear ${nc.length===1?'esta categoría':'estas categorías'}: ${nc.map(c=>'<b>'+esc(c.name)+'</b>').join(', ')}. Después las podés editar.`;
    $('#sheet-save').textContent=ms.length-old?`Importar (${ms.length-old})`:'Importar'};
  openSheet({title:'Importar planilla',saveLabel:'Importar',body,onSave:async()=>{
    const ms=pick();if(!ms.length){toast('No queda nada para importar');return false}
    let a=S.accounts[$('#imp-acc')?.value];let created=null;
    if(!a){created={id:newId(),name:'Personal',color:'blue',scope:'p',created:Date.now()};a={...created,movs:{},metas:{}}}
    const nc=usedNew(ms);
    const ok=await write(async()=>{
      if(created){await B.putAccount(created);a=S.accounts[created.id]||a}
      if(nc.length){const l=expCats().slice();const oi=l.findIndex(c=>c.id==='otros');oi>=0?l.splice(oi,0,...nc):l.push(...nc);await B.saveSettings({...S.settings,expCats:l})}
      const now=Date.now();
      const pays={};const c=st.card?cardById(st.card):null;
      for(const m of ms){let{cardPay,cq,...body}=m;
        if(c&&cq){body={...body,kind:'cuota',card:c.id,n:cq.n,idx:cq.i,int:0,desc:cq.desc||body.desc,rec:false};if(body.month<NOW_M)pays[body.month]=(pays[body.month]||0)+body.amount}
        const old=a.movs?.[m.id];await B.putMov(a,{...body,paid:old?.paid||body.paid,skip:old?.skip||body.skip,by:ME.uid||null,created:old?.created||now})}
      for(const[X,v]of Object.entries(pays)){const d=cardDue(c,X)||X+'-'+pad(daysIn(X));
        await B.putMov(a,{kind:'variable',amount:round2(v),cur:cur(),fx:null,notif:null,desc:'Pago tarjeta '+cardName(c),cat:'tarjeta',catName:'Tarjeta',date:d,due:null,month:d.slice(0,7),rec:false,goal:null,end:null,skip:[],paid:[],card:c.id,cardM:X,by:ME.uid||null,created:now,id:'imp-pay-'+impHash(fname+'|'+c.id+'|'+X)})}
    });
    if(ok){toast(`Listo: se importaron ${pl(ms.length,'movimiento','movimientos')}`);UI.acc=a.id;store('cc-acc',UI.acc);UI.month=months.includes(NOW_M)?NOW_M:months.at(-1);schedule()}
    return ok}});
  const sw=$('#imp-pay');if(sw)sw.onchange=()=>{st.skipPay=sw.checked;refresh()};
  const sel=$('#imp-acc');if(sel)sel.onchange=refresh;
  const cs=$('#imp-card');if(cs)cs.onchange=()=>{st.card=cs.value};
  refresh();
}
function downloadSheetTemplate(){
  const rows=[['Fecha','Tipo','Categoría','Subcategoría','Descripción','Monto','Cuotas'],
    [TODAY_S.split('-').reverse().join('/'),'Ingreso','Sueldo','','Sueldo','850000',''],
    [TODAY_S.split('-').reverse().join('/'),'Gasto','Supermercado','','Compra del mes','95000',''],
    [TODAY_S.split('-').reverse().join('/'),'Fijo','Servicios','Luz','Edenor','28000',''],
    [TODAY_S.split('-').reverse().join('/'),'Gasto','Hogar','','Heladera en cuotas','600000','6']];
  const csv='﻿'+rows.map(r=>r.map(v=>/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v).join(';')).join('\r\n');
  const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const l=document.createElement('a');l.href=u;l.download='chanchito-planilla-modelo.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
  toast('Planilla modelo descargada');
}
